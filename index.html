<script>
    const lines = {
      attack1: { name: "Attack 1", code: "attack1", np: 0, nozzleName: "None", fl: 0, elev: 0, appliance: 0, customFlow: 0, hoses: [] },
      attack2: { name: "Attack 2", code: "attack2", np: 0, nozzleName: "None", fl: 0, elev: 0, appliance: 0, customFlow: 0, hoses: [] },
      bumper:  { name: "Bumper",   code: "bumper",  np: 0, nozzleName: "None", fl: 0, elev: 0, appliance: 0, customFlow: 0, hoses: [] },
      monitor: { name: "Monitor",  code: "monitor", np: 0, nozzleName: "None", fl: 0, elev: 0, appliance: 0, customFlow: 0, hoses: [] }
    };

    let currentLineKey = 'attack1';
    let supplyMode = 'none';

    const tanks = {
      engine: { current: 2500, max: 2500, name: "On-Board Tank" },
      draft: { current: 10000, max: 10000, name: "Draft Dump Tank" },
      nursing: { current: 12000, max: 12000, name: "Nursing Tender" }
    };

    function litersToGallons(liters) {
      return Math.round(liters * 0.264172);
    }

    function toggleSunlightMode() {
      document.body.classList.toggle('sunlight-mode');
      const btn = document.querySelector('.sunlight-btn');
      if (btn) {
        btn.innerText = document.body.classList.contains('sunlight-mode') ? "🌙 Night Mode" : "☀️ Sun Mode";
      }
    }

    function selectLine(lineKey) {
      currentLineKey = lineKey;
      document.querySelectorAll('.btn-group .btn').forEach(b => {
        if (b.id.startsWith('line-btn-')) b.classList.remove('active');
      });
      const targetBtn = document.getElementById(`line-btn-${lineKey}`);
      if (targetBtn) targetBtn.classList.add('active');
      
      const titleElem = document.getElementById('active-line-title');
      if (titleElem) titleElem.innerText = `${lines[lineKey].name.toUpperCase()} - TARGET PDP`;
      
      updateControlPanelStates();
      calculateAll();
    }

    function setSupply(mode) {
      supplyMode = supplyMode === mode ? 'none' : mode;
      ['hydrant', 'drafting', 'nursing'].forEach(m => {
        const b = document.getElementById(`sup-btn-${m}`);
        if (b) b.classList.remove('active');
      });
      if (supplyMode !== 'none') {
        const activeBtn = document.getElementById(`sup-btn-${supplyMode}`);
        if (activeBtn) activeBtn.classList.add('active');
      }
      calculateAll();
    }

    function setNozzle(name, pressure) {
      const line = lines[currentLineKey];
      line.nozzleName = name;
      line.np = pressure;
      if (line.customFlow === 0) {
        line.customFlow = (name === "Fog Nozzle") ? 470 : 700;
      }
      updateControlPanelStates();
      calculateAll();
    }

    function clearNozzle() {
      const line = lines[currentLineKey];
      line.nozzleName = "None";
      line.np = 0;
      line.customFlow = 0;
      updateControlPanelStates();
      calculateAll();
    }

    function addHose(type, lengthMeters) {
      const line = lines[currentLineKey];
      let cFactor = (type === '44mm') ? 3.325 : 0.75; 
      const newSegment = { type: type, length: lengthMeters, c: cFactor };

      // Large diameter hose (65mm) always sits on the pump/firetruck side (bottom)
      if (type === '65mm') {
        line.hoses.unshift(newSegment);
      } else {
        line.hoses.push(newSegment);
      }
      calculateAll();
    }

    function removeHose() {
      const line = lines[currentLineKey];
      if (line.hoses.length > 0) {
        line.hoses.pop();
      }
      if (line.hoses.length === 0) {
        line.elev = 0;
      }
      calculateAll();
    }

    function adjustElevation(val) {
      const line = lines[currentLineKey];
      if (line.hoses.length > 0) {
        line.elev += val;
        if (line.elev < 0) line.elev = 0;
      }
      calculateAll();
    }

    function toggleStandpipe() {
      const line = lines[currentLineKey];
      line.appliance = line.appliance === 0 ? 70 : 0;
      const btn = document.getElementById('standpipe-btn');
      if (btn) {
        if (line.appliance > 0) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
      calculateAll();
    }

    function setFlow(lpm) {
      const line = lines[currentLineKey];
      if (line.nozzleName === "None") {
        line.nozzleName = "Fog Nozzle";
        line.np = 700;
      }
      line.customFlow = lpm;
      updateControlPanelStates();
      calculateAll();
    }

    function applyPreset(preset) {
      resetActiveLine();
      const line = lines[currentLineKey];
      if (preset === 'speedlay') {
        line.nozzleName = "Fog Nozzle";
        line.np = 700;
        line.customFlow = 470;
        addHose('44mm', 15);
        addHose('44mm', 15);
        addHose('44mm', 15);
        addHose('44mm', 15);
      } else if (preset === 'highrise') {
        line.nozzleName = "Smooth Bore";
        line.np = 350;
        line.customFlow = 700;
        addHose('65mm', 15);
        addHose('65mm', 15);
        line.elev = 30;
        line.appliance = 70;
        const spBtn = document.getElementById('standpipe-btn');
        if (spBtn) spBtn.classList.add('active');
      }
      updateControlPanelStates();
      calculateAll();
    }

    function resetActiveLine() {
      const line = lines[currentLineKey];
      line.np = 0;
      line.nozzleName = "None";
      line.fl = 0;
      line.elev = 0;
      line.appliance = 0;
      line.customFlow = 0;
      line.hoses = [];
      const spBtn = document.getElementById('standpipe-btn');
      if (spBtn) spBtn.classList.remove('active');
      updateControlPanelStates();
      calculateAll();
    }

    function calculateFlow(line) {
      if (line.nozzleName === "None") return { lpm: 0, gpm: 0 };
      if (line.customFlow > 0) {
        return { lpm: line.customFlow, gpm: Math.round(line.customFlow / 3.785) };
      }
      let has65 = line.hoses.some(h => h.type === '65mm');
      if (line.nozzleName === "Fog Nozzle") {
        return has65 ? { lpm: 950, gpm: 250 } : { lpm: 570, gpm: 150 };
      } else if (line.nozzleName === "Smooth Bore") {
        return has65 ? { lpm: 1000, gpm: 265 } : { lpm: 700, gpm: 185 };
      }
      return { lpm: 0, gpm: 0 };
    }

    function calculateAll() {
      let maxPDP = 0;
      let totalLPM = 0;

      Object.keys(lines).forEach(key => {
        const l = lines[key];
        if (l.hoses.length === 0) l.elev = 0;

        let flow = calculateFlow(l);
        let totalFL = 0;
        if (flow.lpm > 0 && l.hoses.length > 0) {
          let qFactor = flow.lpm / 100;
          l.hoses.forEach(h => {
            let segmentFL = h.c * Math.pow(qFactor, 2) * (h.length / 15);
            totalFL += segmentFL;
          });
        }
        l.fl = Math.round(totalFL);

        let linePDP = (l.hoses.length > 0 || l.nozzleName !== "None") ? Math.round(l.np + l.fl + l.elev + l.appliance) : 0;
        if (linePDP > maxPDP) maxPDP = linePDP;

        totalLPM += flow.lpm;
      });

      const masterPdpElem = document.getElementById('master-pdp');
      if (masterPdpElem) masterPdpElem.innerHTML = `${maxPDP} <span style="font-size: 1.1rem;">kPa</span>`;

      const activeLine = lines[currentLineKey];
      let activeFlow = calculateFlow(activeLine);
      let activeFL = activeLine.fl;
      let activeLinePDP = (activeLine.hoses.length > 0 || activeLine.nozzleName !== "None") ? Math.round(activeLine.np + activeFL + activeLine.elev + activeLine.appliance) : 0;
      
      const targetPdpElem = document.getElementById('target-pdp');
      if (targetPdpElem) targetPdpElem.innerHTML = `${activeLinePDP} <span style="font-size: 1rem;">kPa</span>`;
      
      let totalFeet = activeLine.hoses.reduce((acc, h) => acc + Math.round(h.length * 3.28084), 0);
      let totalMeters = activeLine.hoses.reduce((acc, h) => acc + h.length, 0);
      
      const summaryElem = document.getElementById('line-summary-text');
      if (summaryElem) summaryElem.innerText = `${activeLine.nozzleName} (${activeFlow.lpm} L/min) | ${totalFeet}ft / ${totalMeters}m | ${activeLine.elev / 10} Floor(s)`;

      const gateElem = document.getElementById('line-gate-status');
      if (gateElem) {
        if (activeLinePDP === maxPDP && maxPDP > 0) {
          gateElem.innerText = "100% FULLY OPEN DISCHARGE";
          gateElem.style.color = "var(--accent-green)";
        } else if (activeLinePDP < maxPDP && activeLinePDP > 0) {
          let pct = Math.round((activeLinePDP / maxPDP) * 100);
          gateElem.innerText = `GATE DOWN TO ${pct}% OPEN`;
          gateElem.style.color = "#eab308";
        } else {
          gateElem.innerText = "LINE INACTIVE";
          gateElem.style.color = "var(--text-sub)";
        }
      }

      updateTacticalWarnings(maxPDP, activeLinePDP, activeFL);
      updateTankAndTimer(totalLPM);
    }

    function updateTacticalWarnings(maxPDP, activePDP, activeFL) {
      const container = document.getElementById('tactical-warning-container');
      if (!container) return;
      container.innerHTML = "";

      const activeLine = lines[currentLineKey];
      let flow = calculateFlow(activeLine);

      if (activeFL >= 300) {
        container.innerHTML += `
          <div class="warning-card">
            <div class="warning-title">⚠️ SEVERE FRICTION LOSS (${activeFL} kPa)</div>
            Friction loss on this line is high. Consider substituting or adding a 65mm supply segment to optimize flow.
          </div>`;
      }

      if (activeLine.nozzleName === "Smooth Bore" && flow.lpm >= 950) {
        container.innerHTML += `
          <div class="warning-card">
            <div class="warning-title">💪 HIGH NOZZLE REACTION</div>
            High-volume smooth bore stream (${flow.lpm} L/min). Ensure at least 2 firefighters on the nozzle line.
          </div>`;
      }

      if (supplyMode === 'hydrant') {
        container.innerHTML += `
          <div class="warning-card">
            <div class="warning-title">⚠️ HYDRANT RESIDUAL WARNING</div>
            Maintain intake residual above 140 kPa (20 psi) to prevent pump cavitation.
          </div>`;
      } else if (supplyMode === 'drafting') {
        container.innerHTML += `
          <div class="warning-card">
            <div class="warning-title">⚠️ DRAFTING LIFT LIMIT</div>
            Ensure maximum vertical lift height does not exceed 3 meters (10 ft).
          </div>`;
      } else if (supplyMode === 'nursing') {
        container.innerHTML += `
          <div class="warning-card">
            <div class="warning-title">🚒 NURSING / RELAY BUFFER</div>
            Supply engine must maintain at least 140 kPa intake buffer pressure.
          </div>`;
      }

      if (maxPDP > 1750) {
        container.innerHTML += `
          <div class="warning-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.2);">
            <div class="warning-title">🚨 OVERPRESSURE DANGER (${maxPDP} kPa)</div>
            Target PDP exceeds safety thresholds (1750 kPa / 250 psi). Verify structural hose ratings!
          </div>`;
      }
    }

    function updateTankAndTimer(totalLPM) {
      const timerElem = document.getElementById('empty-timer');
      const totalFlowElem = document.getElementById('total-flow');
      const barElem = document.getElementById('tank-bar');
      const labelElem = document.getElementById('tank-capacity-label');

      if (totalFlowElem) totalFlowElem.innerText = `${totalLPM} L/min (${Math.round(totalLPM / 3.785)} GPM)`;

      ['engine', 'draft', 'nursing'].forEach(k => {
        const t = tanks[k];
        const tankValElem = document.getElementById(`${k}-tank-val`);
        if (tankValElem) {
          tankValElem.innerText = `${t.current} L (${litersToGallons(t.current)} gal) / ${t.max} L (${litersToGallons(t.max)} gal)`;
        }
      });

      if (supplyMode === 'hydrant') {
        if (timerElem) {
          timerElem.innerText = "∞ (HYDRANT)";
          timerElem.style.color = "var(--accent-green)";
        }
        if (labelElem) labelElem.innerText = "ACTIVE SOURCE: HYDRANT (CONTINUOUS)";
        if (barElem) {
          barElem.style.width = "100%";
          barElem.style.backgroundColor = "var(--accent-blue)";
        }
        return;
      }

      let activeTankKey = 'engine';
      let sourceName = "ON-BOARD TANK";
      if (supplyMode === 'drafting') { activeTankKey = 'draft'; sourceName = "STATIC DUMP TANK"; }
      if (supplyMode === 'nursing') { activeTankKey = 'nursing'; sourceName = "NURSING TENDER"; }

      const tank = tanks[activeTankKey];
      if (labelElem) labelElem.innerText = `ACTIVE SOURCE: ${sourceName}`;
      
      let pct = Math.round((tank.current / tank.max) * 100);
      if (barElem) {
        barElem.style.width = `${pct}%`;
        barElem.style.backgroundColor = pct > 50 ? "var(--accent-green)" : (pct > 20 ? "#eab308" : "#ef4444");
      }

      if (totalLPM <= 0) {
        if (timerElem) {
          timerElem.innerText = "--:--";
          timerElem.style.color = "var(--accent-blue)";
        }
        return;
      }

      let totalMinutes = tank.current / totalLPM;
      let mins = Math.floor(totalMinutes);
      let secs = Math.floor((totalMinutes - mins) * 60);

      if (timerElem) {
        timerElem.innerText = `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
        timerElem.style.color = mins < 2 ? "#ef4444" : "var(--accent-blue)";
      }
    }

    function adjustTankCapacity(tankKey, amount) {
      const tank = tanks[tankKey];
      tank.max += amount;
      if (tank.max < 500) tank.max = 500;
      if (tank.current > tank.max) tank.current = tank.max;
      calculateAll();
    }

    function refillTank(tankKey) {
      const tank = tanks[tankKey];
      tank.current = tank.max;
      calculateAll();
    }

    function updateControlPanelStates() {
      document.querySelectorAll('.flow-grid .btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#nozzle-btn-fog, #nozzle-btn-smooth').forEach(b => b.classList.remove('active'));

      const line = lines[currentLineKey];
      if (line.nozzleName === "Fog Nozzle") document.getElementById('nozzle-btn-fog')?.classList.add('active');
      if (line.nozzleName === "Smooth Bore") document.getElementById('nozzle-btn-smooth')?.classList.add('active');

      if (line.customFlow > 0) {
        const flowBtn = document.getElementById(`flow-btn-${line.customFlow}`);
        if (flowBtn) flowBtn.classList.add('active');
      }
    }

    // --- ANIMATED CANVAS SCALING & RENDER LOOP ---
    let pulseOffset = 0;

    function renderLoop() {
      const canvas = document.getElementById('hoseCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        
        let maxSegments = Math.max(1, ...Object.values(lines).map(l => l.hoses.length));
        let requiredHeight = Math.max(380, 140 + (maxSegments * 26));

        if (canvas.width !== canvas.parentElement.clientWidth - 16 || canvas.height !== requiredHeight) {
          canvas.width = canvas.parentElement.clientWidth - 16;
          canvas.height = requiredHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const lineKeys = Object.keys(lines);
        const colWidth = canvas.width / lineKeys.length;
        const engineY = canvas.height - 35;

        lineKeys.forEach((key, index) => {
          const l = lines[key];
          const centerX = colWidth * index + colWidth / 2;
          let lPDP = (l.hoses.length > 0 || l.nozzleName !== "None") ? Math.round(l.np + l.fl + l.elev + l.appliance) : 0;
          let flow = calculateFlow(l);

          let segmentHeight = 26;
          let totalHoseHeight = l.hoses.length * segmentHeight;
          let startY = engineY - 55 - totalHoseHeight;
          if (startY < 75) startY = 75;

          let currentY = startY;

          if (l.hoses.length > 0) {
            l.hoses.forEach((h) => {
              let hoseColor = '#facc15';
              let hoseWidth = h.type === '44mm' ? 8 : 18;

              ctx.fillStyle = hoseColor;
              ctx.fillRect(centerX - hoseWidth / 2, currentY, hoseWidth, segmentHeight);

              ctx.fillStyle = '#64748b';
              ctx.fillRect(centerX - hoseWidth / 2 - 2, currentY, hoseWidth + 4, 3);
              ctx.fillRect(centerX - hoseWidth / 2 - 2, currentY + segmentHeight - 3, hoseWidth + 4, 3);

              currentY += segmentHeight;
            });

            if (flow.lpm > 0) {
              let pulseY = (startY + totalHoseHeight) - ((pulseOffset * 0.8) % totalHoseHeight);
              ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
              ctx.fillRect(centerX - 3, pulseY, 6, 8);
            }
          }

          if (l.nozzleName !== "None") {
            let nozzleY = startY - 8;
            ctx.fillStyle = document.body.classList.contains('sunlight-mode') ? "#0f172a" : "#f3f4f6";
            ctx.beginPath();
            if (l.nozzleName === "Fog Nozzle") {
              ctx.moveTo(centerX - 10, nozzleY);
              ctx.lineTo(centerX + 10, nozzleY);
              ctx.lineTo(centerX, nozzleY - 14);
            } else {
              ctx.moveTo(centerX, nozzleY - 14);
              ctx.lineTo(centerX + 6, nozzleY);
              ctx.lineTo(centerX - 6, nozzleY);
            }
            ctx.closePath();
            ctx.fill();

            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💧💦", centerX, nozzleY - 20);

            ctx.fillStyle = document.body.classList.contains('sunlight-mode') ? "#475569" : "#9ca3af";
            ctx.font = "bold 8px var(--font-mono)";
            ctx.fillText(l.nozzleName === "Fog Nozzle" ? "[FOG]" : "[BORE]", centerX, nozzleY - 30);
          }

          if (flow.lpm > 0) {
            ctx.fillStyle = "#00b4d8";
            ctx.font = "bold 9px var(--font-mono)";
            ctx.fillText(`${flow.lpm} L/m`, centerX, startY - 42);
          }

          ctx.fillStyle = document.body.classList.contains('sunlight-mode') ? "#0f172a" : "#f3f4f6";
          ctx.font = "bold 11px var(--font-sans)";
          ctx.fillText(l.name, centerX, engineY - 25);

          ctx.fillStyle = "var(--accent-green)";
          ctx.font = "bold 12px var(--font-mono)";
          ctx.fillText(`${lPDP} kPa`, centerX, engineY - 12);

          let maxPDP = 0;
          Object.values(lines).forEach(item => {
            let itemPDP = (item.hoses.length > 0 || item.nozzleName !== "None") ? Math.round(item.np + item.fl + item.elev + item.appliance) : 0;
            if (itemPDP > maxPDP) maxPDP = itemPDP;
          });

          if (lPDP === maxPDP && maxPDP > 0) {
            ctx.fillStyle = "#15803d";
            ctx.fillRect(centerX - 35, engineY - 2, 70, 16);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 9px var(--font-mono)";
            ctx.fillText("100% OPEN", centerX, engineY + 10);
          } else if (lPDP < maxPDP && maxPDP > 0 && lPDP > 0) {
            let pct = Math.round((lPDP / maxPDP) * 100);
            ctx.fillStyle = "#ca8a04";
            ctx.fillRect(centerX - 35, engineY - 2, 70, 16);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 9px var(--font-mono)";
            ctx.fillText(`GATE ${pct}%`, centerX, engineY + 10);
          }
        });

        let centerXCanvas = canvas.width / 2;

        ctx.font = "45px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🚒", centerXCanvas, engineY + 28);

        pulseOffset += 1.5;
        let flashState = Math.sin(pulseOffset * 0.25) > 0;
        ctx.fillStyle = flashState ? "#ef4444" : "#3b82f6";
        ctx.beginPath();
        ctx.arc(centerXCanvas - 8, engineY - 2, 4, 0, Math.PI * 2);
        ctx.fill();

        if (supplyMode === 'nursing') {
          ctx.fillText("🚒", centerXCanvas + 75, engineY + 28);
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 8px var(--font-mono)";
          ctx.fillText("NURSING TENDER", centerXCanvas + 75, engineY + 40);

          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(centerXCanvas + 22, engineY + 15);
          ctx.lineTo(centerXCanvas + 48, engineY + 15);
          ctx.stroke();
        } else if (supplyMode === 'hydrant') {
          ctx.font = "34px sans-serif";
          ctx.fillText("🚰", centerXCanvas + 65, engineY + 24);
          ctx.fillStyle = "#00b4d8";
          ctx.font = "bold 8px var(--font-mono)";
          ctx.fillText("FIRE HYDRANT", centerXCanvas + 65, engineY + 40);

          ctx.strokeStyle = "#00b4d8";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(centerXCanvas + 20, engineY + 15);
          ctx.lineTo(centerXCanvas + 42, engineY + 15);
          ctx.stroke();
        } else if (supplyMode === 'drafting') {
          ctx.font = "34px sans-serif";
          ctx.fillText("💧", centerXCanvas + 65, engineY + 24);
          ctx.fillStyle = "#eab308";
          ctx.font = "bold 8px var(--font-mono)";
          ctx.fillText("STATIC / DRAFT", centerXCanvas + 65, engineY + 40);

          ctx.strokeStyle = "#475569";
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(centerXCanvas + 20, engineY + 15);
          ctx.lineTo(centerXCanvas + 42, engineY + 15);
          ctx.stroke();
        }
      }
      requestAnimationFrame(renderLoop);
    }

    selectLine('attack1');
    requestAnimationFrame(renderLoop);
  </script>
