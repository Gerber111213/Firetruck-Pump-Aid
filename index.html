<!DOCTYPE html>
<html>
<head>
  <title>Engine PDP Dashboard</title>
  <style>
    body {
      background-image: linear-gradient(to right, #ff5e00, #39ff14);
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      color: white;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 30px;
      gap: 20px;
    }

    .calc-box, .diagram-box {
      background-color: rgba(0, 0, 0, 0.88);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .calc-box {
      width: 540px;
      display: flex;
      flex-direction: column;
    }

    .diagram-box {
      width: 250px;
      height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2 { margin-top: 0; text-align: center; }

    /* Line Selector Tabs */
    .line-selector {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 15px;
    }

    .line-tab {
      flex: 1;
      padding: 10px 4px;
      background: #333;
      color: #ccc;
      border: 2px solid #555;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      text-align: center;
    }

    .line-tab.active {
      background: #ff5e00;
      color: white;
      border-color: #39ff14;
    }

    /* PDP Gauge Display */
    .gauge-card {
      background: #111;
      border: 2px solid #39ff14;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .gauge-title {
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gauge-value {
      font-size: 36px;
      font-weight: bold;
      color: #39ff14;
      margin: 5px 0;
    }

    /* Control Buttons */
    .btn-group {
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
    }

    .btn-group h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ddd;
    }

    button {
      background-color: #ff5e00;
      color: white;
      border: none;
      padding: 8px 12px;
      margin: 3px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background-color: #e05200; }
    button.reset { background-color: #d9534f; width: 100%; margin-top: 10px; }

    .summary-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
    }

    /* Custom Hose & Coupling Styling */
    #diagram-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding-top: 10px;
    }

    .truck-part { font-size: 55px; line-height: 1; }
    .hose-section { display: flex; flex-direction: column; align-items: center; }
    
    .coupling {
      width: 18px; height: 6px;
      background: linear-gradient(to right, #888, #ddd, #888);
      border-radius: 2px; border: 1px solid #444;
    }
    
    .hose-line {
      width: 8px; height: 40px;
      background-color: #fdfd04;
      border-left: 1px solid #c8c800; border-right: 1px solid #c8c800;
    }

    .smooth-bore-nozzle {
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 28px solid #d4af37;
      transform: rotate(180deg); margin-top: 2px;
    }

    .fog-nozzle-body { width: 10px; height: 16px; background: linear-gradient(to right, #444, #888, #444); }
    .fog-nozzle-head { width: 22px; height: 10px; background-color: #222; border-radius: 3px; border: 1px solid #555; }
  </style>
</head>
<body>

  <!-- Left Box: PDP Dashboard -->
  <div class="calc-box">
    <h1>PUMP DISCHARGE DASHBOARD</h1>

    <!-- 1. Line Selector Buttons -->
    <div class="line-selector">
      <div class="line-tab active" id="tab-attack1" onclick="selectLine('attack1')">Attack 1</div>
      <div class="line-tab" id="tab-attack2" onclick="selectLine('attack2')">Attack 2</div>
      <div class="line-tab" id="tab-bumper" onclick="selectLine('bumper')">Bumper Line</div>
      <div class="line-tab" id="tab-monitor" onclick="selectLine('monitor')">Monitor</div>
    </div>

    <!-- 2. Active Line PDP Gauge -->
    <div class="gauge-card">
      <div class="gauge-title" id="gauge-label">ATTACK LINE 1 - TARGET PDP</div>
      <div class="gauge-value"><span id="pdp-gauge">0</span> <small style="font-size:18px;">kPa</small></div>
    </div>

    <!-- 3. Nozzle Selection -->
    <div class="btn-group">
      <h3>1. Select Nozzle (Nozzle Pressure)</h3>
      <button onclick="setNozzle('Fog Nozzle', 700)">Fog Nozzle (700 kPa)</button>
      <button onclick="setNozzle('Smooth Bore', 350)">Smooth Bore (350 kPa)</button>
    </div>

    <!-- 4. Hose Addition -->
    <div class="btn-group">
      <h3>2. Add Hose Lengths (Friction Loss)</h3>
      <button onclick="addHose('44mm', 100)">+ 1 Length 44mm (100 kPa)</button>
      <button onclick="addHose('65mm', 30)">+ 1 Length 65mm (30 kPa)</button>
    </div>

    <button class="reset" onclick="resetActiveLine()">Reset Active Line</button>

    <div class="summary-box">
      <strong>Active Line Summary:</strong>
      <div id="line-summary">No nozzle or hose added.</div>
    </div>
  </div>

  <!-- Right Box: Lay Diagram -->
  <div class="diagram-box">
    <h2>Lay Diagram</h2>
    <div id="diagram-container">
      <div class="truck-part">🚒</div>
      <div id="active-diagram"></div>
    </div>
  </div>

  <script>
    // Independent state for all 4 lines
    const lines = {
      attack1: { name: "Attack Line 1", np: 0, nozzleName: "None", fl: 0, hoses: [] },
      attack2: { name: "Attack Line 2", np: 0, nozzleName: "None", fl: 0, hoses: [] },
      bumper:  { name: "Bumper Line",   np: 0, nozzleName: "None", fl: 0, hoses: [] },
      monitor: { name: "Monitor",       np: 0, nozzleName: "None", fl: 0, hoses: [] }
    };

    let currentLineKey = 'attack1';

    function selectLine(lineKey) {
      currentLineKey = lineKey;

      document.querySelectorAll('.line-tab').forEach(tab => tab.classList.remove('active'));
      document.getElementById(`tab-${lineKey}`).classList.add('active');

      document.getElementById('gauge-label').innerText = `${lines[lineKey].name.toUpperCase()} - TARGET PDP`;

      updateDashboard();
    }

    function setNozzle(name, pressure) {
      lines[currentLineKey].nozzleName = name;
      lines[currentLineKey].np = pressure;
      updateDashboard();
    }

    function addHose(name, flValue) {
      lines[currentLineKey].hoses.push(name);
      lines[currentLineKey].fl += flValue;
      updateDashboard();
    }

    function resetActiveLine() {
      lines[currentLineKey] = {
        name: lines[currentLineKey].name,
        np: 0,
        nozzleName: "None",
        fl: 0,
        hoses: []
      };
      updateDashboard();
    }

    function updateDashboard() {
      const activeLine = lines[currentLineKey];
      const totalPDP = activeLine.np + activeLine.fl;

      document.getElementById('pdp-gauge').innerText = totalPDP;

      let summaryText = `Nozzle: ${activeLine.nozzleName} (${activeLine.np} kPa) | Hoses: ${activeLine.hoses.length} lengths (${activeLine.fl} kPa FL)`;
      document.getElementById('line-summary').innerText = summaryText;

      drawDiagram();
    }

    function drawDiagram() {
      const activeLine = lines[currentLineKey];
      const container = document.getElementById('active-diagram');
      container.innerHTML = "";

      // Draw Hoses
      activeLine.hoses.forEach(() => {
        const hoseSection = document.createElement('div');
        hoseSection.className = 'hose-section';

        const topCoupling = document.createElement('div');
        topCoupling.className = 'coupling';

        const hoseLine = document.createElement('div');
        hoseLine.className = 'hose-line';

        const bottomCoupling = document.createElement('div');
        bottomCoupling.className = 'coupling';

        hoseSection.appendChild(topCoupling);
        hoseSection.appendChild(hoseLine);
        hoseSection.appendChild(bottomCoupling);
        container.appendChild(hoseSection);
      });

      // Draw Nozzles
      if (activeLine.nozzleName === "Fog Nozzle") {
        const body = document.createElement('div');
        body.className = 'fog-nozzle-body';
        const head = document.createElement('div');
        head.className = 'fog-nozzle-head';
        container.appendChild(body);
        container.appendChild(head);
      } else if (activeLine.nozzleName === "Smooth Bore") {
        const smoothBore = document.createElement('div');
        smoothBore.className = 'smooth-bore-nozzle';
        container.appendChild(smoothBore);
      }
    }

    updateDashboard();
  </script>

</body>
</html>
